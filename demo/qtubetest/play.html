<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moved — FTE Demo Player</title>
    <link rel="icon" type="image/png" href="../demo.png">
    <!-- The player now lives at /demo/play/. This stub keeps older links and older
         PakScape builds working; the script below forwards the query string, which the
         meta refresh cannot carry. -->
    <meta http-equiv="refresh" content="3; url=../play/">
    <style>
        body {
            background: #14161a;
            color: #d7d3cc;
            font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        a { color: #d9a05b; }
    </style>
</head>
<body>
    <main>
        <h1>The demo player moved</h1>
        <p>It now lives at <a id="target" href="../play/">/demo/play/</a>.</p>
        <p>Taking you there…</p>
    </main>
    <script>
        (function () {
            var destination = "../play/" + window.location.search + window.location.hash;
            var link = document.getElementById("target");
            if (link) {
                link.setAttribute("href", destination);
            }
            // replace() so the dead path does not sit in the back history.
            window.location.replace(destination);
        }());
    </script>
</body>
</html>
